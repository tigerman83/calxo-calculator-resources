name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: npm ci
        working-directory: javascript
      - run: npm run check
        working-directory: javascript
      - run: npm test
        working-directory: javascript
      - run: node examples/usage.js
      - run: node scripts/build-conversion-dataset.mjs
      - run: python3 scripts/build-conversion-notebook.py
      - run: git diff --exit-code -- datasets/conversion-reference
      - run: mkdir -p dist
      - run: npm pack --pack-destination ../dist
        working-directory: javascript
      - run: npm run test:package
        working-directory: javascript
